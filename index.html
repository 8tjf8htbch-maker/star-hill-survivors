<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11152d">
<title>星の丘のサバイバーズ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11152d}body{touch-action:none;overscroll-behavior:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#movePad{display:none;position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(94px,calc(env(safe-area-inset-bottom) + 82px));z-index:5;gap:12px;touch-action:none;user-select:none}
.moveButton{width:68px;height:68px;border:2px solid #c6b5d8;border-radius:18px;background:rgba(28,32,62,.82);color:#fff0c9;font:700 30px system-ui;box-shadow:0 3px 0 rgba(0,0,0,.35);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.moveButton:active{background:rgba(105,86,130,.95);transform:translateY(2px)}
@media (orientation:landscape){#movePad{left:max(12px,env(safe-area-inset-left));bottom:max(70px,calc(env(safe-area-inset-bottom) + 58px));gap:8px}.moveButton{width:54px;height:54px;border-radius:14px;font-size:24px}canvas{width:100vw;height:100dvh}}
@media (orientation:portrait) and (max-height:430px){#movePad{bottom:max(66px,calc(env(safe-area-inset-bottom) + 56px));gap:6px}.moveButton{width:48px;height:48px;font-size:22px}}
@media (hover:none),(pointer:coarse){#movePad{display:flex}}
@media (max-width:420px){.moveButton{width:60px;height:60px;font-size:26px}#movePad{gap:8px}}
</style>
</head>
<body>
<canvas id="game" aria-label="星の丘のサバイバーズ。基地で仲間と過ごし、探索して、思い出を残そう"></canvas>
<div id="movePad" aria-label="キャラクター移動コントローラー">
 <button class="moveButton" id="moveLeft" aria-label="左へ移動">◀</button>
 <button class="moveButton" id="moveRight" aria-label="右へ移動">▶</button>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;
const W=480,H=270,SW=32,SH=32,FRAME_COUNT=4,FRAME_RATE=8;
let scale=1,ox=0,oy=0,t=0,last=0;
const keys={left:false,right:false};
const SAVE_KEY='HOSHINO_OKA_SAVE_DATA';
const now=()=>Date.now();
const facilityDefaults=()=>[
 {id:'bonfire',name:'焚き火',level:0,status:'unbuilt',woodCost:[5,50,200,500,1000],metalCost:[0,10,50,100,200],desc:'基地の明かり・木材生産'},
 {id:'hut',name:'小さな小屋',level:0,status:'unbuilt',woodCost:[20,100,300],metalCost:[0,20,80],desc:'ミナの居住地・手紙が増える'},
 {id:'farm',name:'簡易農園',level:0,status:'unbuilt',woodCost:[40,150,400],metalCost:[5,30,100],desc:'食料を自動生産'},
 {id:'lumber_mill',name:'製材所',level:0,status:'unbuilt',woodCost:[60,180,450],metalCost:[5,25,80],desc:'木材の自動生産'},
 {id:'diner',name:'集いの食堂',level:0,status:'unbuilt',woodCost:[80,250,600],metalCost:[15,50,150],desc:'料理で仲間を元気にする'},
 {id:'workshop',name:'クラフト工房',level:0,status:'unbuilt',woodCost:[150,400,900],metalCost:[40,120,300],desc:'装備と強化機能を解放'},
 {id:'observatory',name:'星空の観測台',level:0,status:'unbuilt',woodCost:[300,800,2000],metalCost:[100,300,800],desc:'星晶生産・特殊探索'}
];
const characterDefaults=()=>[
 {id:'mina',name:'ミナ',role:'道具の修理が得意',mood:'ここがみんなの帰る場所になるといいな。',x:135,color:'#d9a2c8',unlocked:false,level:1,exp:0,affinity:1,affinityExp:0},
 {id:'joe',name:'ジョー',role:'料理好き',mood:'温かいスープを作るよ。',x:225,color:'#82b5c6',unlocked:false,level:1,exp:0,affinity:1,affinityExp:0},
 {id:'sera',name:'セラ',role:'天体観測が好き',mood:'星の向こうに、昔の記録が眠っている気がする。',x:315,color:'#9bc48b',unlocked:false,level:1,exp:0,affinity:1,affinityExp:0}
];
const defaultState=()=>({
 mode:'base',wood:10,food:0,metal:0,starCrystals:0,herbs:0,crystal:0,level:0,lamps:false,flowers:false,bridge:false,
 lastSeen:now(),createdAt:now(),day:1,progressStep:0,explore:null,currentArea:'forest_1',clearedAreas:[],playerX:72,
 events:[],memories:[],pairEvents:[],talkedToday:false,photos:[],letters:[],recipes:[],
 companions:characterDefaults(),facilities:facilityDefaults()
});
let state=defaultState(),toast='',toastUntil=0,dialog=null,player={x:72,dir:1,walking:false};
function normalizeState(s){
 const d=defaultState();state={...d,...s};
 state.wood=Math.max(0,Number(s.wood??10)||0);state.food=Math.max(0,Number(s.food??0)||0);state.metal=Math.max(0,Number(s.metal??0)||0);state.starCrystals=Math.max(0,Number(s.starCrystals??s.crystal??0)||0);
 state.herbs=Math.max(0,Number(s.herbs??0)||0);state.crystal=state.starCrystals;
 state.progressStep=Math.max(0,Number(s.progressStep??0)||0);state.clearedAreas=Array.isArray(s.clearedAreas)?s.clearedAreas:[];
 state.events=Array.isArray(s.events)?s.events:[];state.memories=Array.isArray(s.memories)?s.memories:[];state.pairEvents=Array.isArray(s.pairEvents)?s.pairEvents:[];
 state.companions=characterDefaults().map(base=>({...base,...((s.companions||[]).find(x=>x.id===base.id)||{})}));
 if(s.companions?.some(x=>x.id==='luna')){const old=s.companions;state.companions=characterDefaults().map((base,i)=>({...base,...(old.find(x=>x.id===base.id)||{}),unlocked:base.id==='mina'?true:(old.find(x=>x.id===base.id)?.unlocked??false)}))}
 state.facilities=facilityDefaults().map(base=>({...base,...((s.facilities||[]).find(x=>x.id===base.id)||{})}));
 if(s.facilities?.some(x=>x.id==='kitchen')){const old=s.facilities;state.facilities=facilityDefaults().map((base,i)=>({...base,level:old.find(x=>x.id===(base.id==='diner'?'kitchen':base.id))?.level||0,status:(old.find(x=>x.id===(base.id==='diner'?'kitchen':base.id))?.level||0)>0?'active':'unbuilt'}))}
 state.lamps=!!s.lamps||state.facilities.find(x=>x.id==='bonfire').level>0;
 state.flowers=!!s.flowers;state.bridge=!!s.bridge;
 return state;
}
function save(){try{state.playerX=Number.isFinite(player.x)?player.x:(Number(state.playerX)||72);localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){toast='セーブできませんでした。端末の空き容量を確認してください。';toastUntil=now()+3500}}
function load(){
 try{
  const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('starHillSurvivors.save.v1');
  if(raw){
   const s=JSON.parse(raw);
   normalizeState(s);
   player.x=Math.max(8,Math.min(W-40,Number(state.playerX)||72));
   const previousTime=Number(s.lastPlayedAt||s.lastSeen||s.createdAt||now());
   const elapsed=Math.max(0,Math.min(8*60*60,Math.floor((now()-previousTime)/1000)));
   processOffline(elapsed);
   state.lastPlayedAt=now();
   save();
  }else{
   state.lastPlayedAt=now();
   save();
  }
 }catch(e){state=defaultState();state.lastPlayedAt=now();save()}
}
function processOffline(seconds){
 const elapsed=Math.max(0,Math.min(8*60*60,Math.floor(Number(seconds)||0)));
 if(elapsed<=0)return;
 const mins=Math.floor(elapsed/60);
 const levels={
  bonfire:state.facilities.find(f=>f.id==='bonfire')?.level||0,
  lumber_mill:state.facilities.find(f=>f.id==='lumber_mill')?.level||0,
  farm:state.facilities.find(f=>f.id==='farm')?.level||0,
  observatory:state.facilities.find(f=>f.id==='observatory')?.level||0
 };
 // 各施設の生産量は「生産速度 × 施設レベル × 経過秒数」で計算。
 const productionRate={woodPerSecond:0.2,lumberMillWoodPerSecond:0.2,foodPerSecond:1/10,starCrystalsPerSecond:1/3600};
 state.wood+=Math.floor(productionRate.woodPerSecond*levels.bonfire*elapsed);
 state.wood+=Math.floor(productionRate.lumberMillWoodPerSecond*levels.lumber_mill*elapsed);
 state.food+=Math.floor(productionRate.foodPerSecond*levels.farm*elapsed);
 state.starCrystals+=Math.floor(productionRate.starCrystalsPerSecond*levels.observatory*elapsed);
 state.crystal=state.starCrystals;
 const count=Math.floor(elapsed/1800);
 for(let i=0;i<count;i++){const pool=eventTemplates.filter(e=>state.companions.some(c=>c.id===e[0]&&c.unlocked));if(pool.length){const ev=pool[(state.events.length+i)%pool.length];addEvent(ev[2],'留守中の出来事')}}
 if(elapsed>60){
  if(count===0)addEvent('不在だった'+mins+'分の間、仲間たちは基地を見守っていました。','留守中の出来事');
  toast='おかえり。留守のあいだの暮らしが日誌に残ったよ。';toastUntil=now()+5000;
 }
}
function checkStory(){
 if(state.progressStep===0){dialog={title:'星の丘へ',lines:['小さな不思議な生き物「ピコ」が現れた。','ピコ：「ココハ『ホシノオカ』。タキビ・ツケル・ト、ナカマ・アツマル・ピ！」','焚き火を調べて、最初の灯りを取り戻そう。']};state.progressStep=1;return}
 if(state.progressStep>=2&&state.facilities.find(f=>f.id==='hut').level>0&&!state.companions.find(c=>c.id==='mina').unlocked){state.companions.find(c=>c.id==='mina').unlocked=true;state.progressStep=3;addEvent('ミナが仲間に加わった。「ここがみんなの帰る場所になるといいな。」','仲間加入');remember('ミナと出会った日');dialog={title:'ミナが仲間になった',lines:['「道具の修理なら得意だよ。」','ミナが基地で暮らし始めた。','仲間との会話と手紙の記録が解放された。']};return}
 if(state.facilities.find(f=>f.id==='farm').level>0&&state.facilities.find(f=>f.id==='diner').level>0&&!state.companions.find(c=>c.id==='joe').unlocked){state.companions.find(c=>c.id==='joe').unlocked=true;state.progressStep=Math.max(state.progressStep,4);addEvent('ジョーが仲間に加わり、食堂を開いた。','仲間加入');dialog={title:'ジョーが仲間になった',lines:['「みんなで食べると、きっとおいしいよ。」','食事のある暮らしが始まった。']};return}
 if(state.clearedAreas.includes('forest_1')&&!state.companions.find(c=>c.id==='sera').unlocked){state.companions.find(c=>c.id==='sera').unlocked=true;state.progressStep=5;addEvent('セラが仲間に加わった。','仲間加入');dialog={title:'セラが仲間になった',lines:['星の観測記録を持つセラが丘に戻ってきた。','写真と地図の記録が解放された。']};}
}
const sprite=new Image();let spriteReady=false;sprite.onload=()=>spriteReady=true;sprite.onerror=()=>spriteReady=false;sprite.src='player.png';
const stars=Array.from({length:105},()=>({x:Math.random()*W,y:Math.random()*145,s:Math.random()>.8?2:1,p:Math.random()*7}));
const eventTemplates=[
  ['mina','joe','ジョーが食器を並べ、ミナが焚き火のそばを整えてくれた。','wood',1],
  ['joe','sera','セラが見つけた薬草を、ジョーがお茶にしてくれた。','herbs',1],
  ['sera','mina','ミナが壊れた植木鉢を直し、セラが小さな芽を植えた。','herbs',1],
  ['mina','sera','ミナとセラが窓辺で、昔見た流れ星の話をしていた。','memory',0],
  ['joe','mina','ジョーが古いランタンを修理した。今夜は少し明るくなりそう。','lamp',0],
  ['sera','joe','セラがジョーの作業机に小さな花を飾った。','memory',0],
  ['mina','joe','少し焦げたパンを囲んで、みんなで笑い声をあげた。','memory',0],
  ['joe','sera','ジョーがデッキの端に腰掛け、セラに星座を教えてもらった。','memory',0],
  ['sera','mina','セラが庭に小さな花壇を作り、ミナが水をあげた。','flower',0],
  ['mina','joe','ミナが「帰ってきたときに灯りが見えるように」とランタンを磨いた。','memory',0]
];
function addEvent(text,type='暮らしの記録'){state.events.unshift({text,type,at:now()});state.events=state.events.slice(0,40)}
function remember(text){if(!state.memories.includes(text))state.memories.unshift(text);state.memories=state.memories.slice(0,30)}
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();load();checkStory();
addEventListener('pagehide',()=>{state.playerX=player.x;state.lastPlayedAt=now();state.lastSeen=state.lastPlayedAt;save()});
// 同じURLを別タブや新しいリンクから開いた場合も、同一ブラウザ内の最新セーブを共有する。
addEventListener('storage',e=>{if(e.key!==SAVE_KEY||!e.newValue)return;try{const incoming=JSON.parse(e.newValue);normalizeState(incoming);player.x=Math.max(8,Math.min(W-40,Number(state.playerX)||72));state.lastPlayedAt=Number(incoming.lastPlayedAt)||now();toast='別の画面で保存した続きに同期しました。';toastUntil=now()+2500;}catch(_){}});
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,size=8,color='#f4e5c4',align='left'){ctx.font=(size*1.2)+'px monospace';ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle=color;ctx.fillText(s,x,y)}
function panel(x,y,w,h){rect(x,y,w,h,'#171a32');rect(x,y,w,1,'#a98d8a');rect(x,y+h-1,w,1,'#5d526b');rect(x,y,1,h,'#8e7d91');rect(x+w-1,y,1,h,'#5d526b')}
function getTimeOfDay(){
 const hour=new Date().getHours();
 if(hour>=6&&hour<11)return 'morning';
 if(hour>=11&&hour<16)return 'day';
 if(hour>=16&&hour<19)return 'evening';
 return 'night';
}
function sky(){
 const phase=getTimeOfDay();
 const palettes={
  morning:['#536b91','#a8a4bd','#dba58c','#e6bd9c'],
  day:['#34577d','#6685a0','#b8a0a8','#d4a18f'],
  evening:['#211f45','#66436a','#bd6d79','#d99a81'],
  night:['#10152e','#272447','#604563','#98687b']
 };
 const colors=palettes[phase];
 // グラデーションを使わず、横帯と小さな色ブロックでレトロRPG風の空にする
 const bands=14;
 for(let i=0;i<bands;i++){
  const k=i/(bands-1),idx=Math.min(3,Math.floor(k*3)),blend=(k*3)-idx;
  const hexA=colors[idx],hexB=colors[Math.min(3,idx+1)];
  const rgbA=[1,3,5].map(n=>parseInt(hexA.slice(n,n+2),16));
  const rgbB=[1,3,5].map(n=>parseInt(hexB.slice(n,n+2),16));
  const mix='#'+rgbA.map((v,j)=>Math.round(v+(rgbB[j]-v)*blend).toString(16).padStart(2,'0')).join('');
  rect(0,Math.floor(i*H/bands),W,Math.ceil(H/bands)+1,mix);
 }
 // 遠景にドット状の霞と空の粒子
 for(let i=0;i<28;i++){const x=(i*61+17)%W,y=38+(i*19)%108;if(i%3!==0)rect(x,y,2,2,phase==='night'?'#454366':'#c5b6c2');}
 if(phase==='night'||phase==='evening'){
  stars.forEach(s=>{if(phase==='night'||s.y<65)rect(s.x,s.y,s.s, s.s,Math.sin(t*2+s.p)>.6?'#fff0bf':'#c1c9e9')});
 }else{
  // Soft, blocky clouds drift gently during daylight.
  for(let i=0;i<4;i++){const x=((i*137+t*(phase==='morning'?2:1.2))%(W+70))-35,y=30+(i%3)*25;rect(x,y,25,4,'#d8d6d9');rect(x+6,y-4,14,4,'#d8d6d9');rect(x+25,y+2,12,3,'#d8d6d9')}
 }
 if(phase==='night'){
  rect(382,22,21,21,'#f5e3b8');rect(391,19,17,22,'#f5e3b8');rect(399,25,11,16,'#292447');
 }else{
  const sunX=phase==='morning'?78:phase==='day'?365:245,sunY=phase==='morning'?45:phase==='day'?30:62;
  rect(sunX,sunY,12,12,'#f6d7a0');rect(sunX-4,sunY+4,20,4,'#f6d7a0');rect(sunX+4,sunY-4,4,20,'#f6d7a0');
 }
}
function ridge(base,color,step,seed){
 for(let x=-step;x<W+step;x+=step){
  const h=18+Math.abs(Math.sin(x*.027+seed))*35,peak=Math.round(x+step*.48),left=Math.round(x),right=Math.round(x+step);
  // 三角形ではなく階段状の輪郭にしてピクセルの山並みにする
  for(let row=0;row<h;row+=4){
   const inset=Math.floor((row/h)*(step*.48)/4)*4;
   rect(left+inset,base-h+row,Math.max(4,right-left-inset*2),4,color);
  }
  rect(left,base-h+Math.floor(h*.58/4)*4,Math.max(4,right-left),4,color);
 }
}
function trees(){
 for(let i=0;i<19;i++){
  const x=Math.round(i*29+Math.sin(i*8)*7),y=Math.round(157+Math.sin(i*5)*7),sway=Math.round(Math.sin(t*.8+i*1.7));
  rect(x+6+sway,y,4,29,'#142c35');
  rect(x+4+sway,y-16,8,8,'#19373c');rect(x+sway,y-8,16,8,'#19373c');rect(x-4+sway,y,24,8,'#19373c');
  rect(x+4+sway,y-12,8,4,'#2b5550');rect(x+sway,y-4,8,4,'#2b5550');rect(x+12+sway,y,8,4,'#2b5550');
  rect(x+4+sway,y+5,4,4,'#355b4b');
 }
}
function water(){
 rect(0,184,W,86,'#192f48');
 for(let i=0;i<45;i++){
  const x=Math.floor((i*37+t*5)%W),y=190+(i*17)%72,w=8+(i%4)*3;
  rect(x,y,w,2,Math.sin(t*1.4+i)>.2?'#52617c':'#344d6b');
  if(i%4===0)rect(x+3,y+3,Math.max(3,w-7),1,'#71839a');
 }
}
function lamp(x,y){let f=.8+.18*Math.sin(t*3+x);ctx.globalAlpha=.1*f;ctx.fillStyle='#ffc36e';ctx.beginPath();ctx.arc(x,y,13+f*4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;rect(x-1,y,2,12,'#4b3b49');rect(x-4,y-7,8,8,'#e98b43');rect(x-2,y-5,4,4,'#fff0a2')}
function cabin(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);rect(0,32,80,3,'#9e6b65');rect(8,12,64,22,'#825b69');rect(4,9,72,5,'#4a405b');rect(13,3,54,8,'#5d4568');rect(19,16,12,11,'#f5b35e');rect(21,18,8,7,'#fff0a2');rect(48,16,12,11,'#f5b35e');rect(50,18,8,7,'#fff0a2');rect(36,22,8,12,'#49354b');rect(10,34,3,20,'#563d48');rect(67,34,3,20,'#563d48');ctx.restore()}

function wrapDialogLine(value,maxWidth,size=8){
 const source=String(value??'');
 const output=[];let line='';
 for(const char of source){
  if(char==='\\n'){output.push(line);line='';continue}
  const candidate=line+char;
  ctx.font=(size*1.2)+'px monospace';
  if(line&&ctx.measureText(candidate).width>maxWidth){output.push(line);line=char}
  else line=candidate;
 }
 if(line||!output.length)output.push(line);
 return output;
}

 dialog={title:'思い出のかけら',lines:lines.concat(keepsakes.length?['—— 大切に残したもの ——',...keepsakes]:[])};
}
function handle(x,y){if(dialog){if(dialog.kind==='party'){if(y>=56&&y<210){const col=Math.floor((x-30)/140),row=Math.floor((y-56)/77),idx=row*3+col;const roster=(state.companions||[]).slice(0,6);const c=roster[idx];const id=c?.id;if(id&&c.unlocked&&col>=0&&col<3&&row>=0&&row<2){const chosen=Array.isArray(state.battlePartyIds)?state.battlePartyIds:[];if(chosen.includes(id)){state.battlePartyIds=chosen.filter(v=>v!==id)}else if(chosen.length<5){state.battlePartyIds=[...chosen,id]}else{toast='編成は5人までです。';toastUntil=now()+2200}save();return}}if(y>198&&x>350){dialog=null;return}dialog=null;return}if(dialog.kind==='areas'&&y>80&&y<181){const idx=Math.floor((y-82)/15);const areaIndex=idx<3?idx:idx-3;const area=['forest_1','city_2','highland_3'][areaIndex];if(area&&idx<3){if(areaIndex>0&&!state.clearedAreas.includes(areaIndex===1?'forest_1':'city_2')){toast='先に前のエリアを探索しよう。';toastUntil=now()+2400;dialog=null;return}dialog=null;explore(area);return}if(area&&idx>=3){if(!state.clearedAreas.includes(area)){toast='先にこのエリアを探索して、ボスの手がかりを見つけよう。';toastUntil=now()+2400;dialog=null;return}dialog=null;startBattle(area,true);return}}if(dialog.kind==='build'&&y>80&&y<180){let idx=Math.floor((y-82)/15);const id=dialog.options?.[idx];if(id){upgrade(id);return}}dialog=null;return}
 if(state.mode==='base'){if(y>226){if(x<100){openParty()}else if(x<201){dialog={title:'探索エリア・ボス挑戦',lines:['1. 忘れられた森（木材・食料）','2. 沈んだ旧市街（金属・部品）','3. 星降りの高原（星晶・高純度金属）','4. 森の番人に挑戦','5. 旧市街の管理機に挑戦','6. 星喰いに挑戦'],kind:'areas'};}else if(x<297)build();else if(x<385)journal();else memories();return}if(y<210){const near=state.companions.find(c=>c.unlocked&&Math.abs((c.x+16)-x)<25);if(near){dialog={title:near.name+' ・ '+near.role,lines:[near.mood,'もう少し一緒に過ごす？']};addEvent(near.name+'と基地で少し話した。','仲間との交流');save()}else{player.x=Math.max(0,Math.min(W-32,x-16));player.dir=x>player.x?1:-1}}}else if(state.mode==='explore'){if(y>226&&x<120)returnFromExplore();else if(y>226&&x>350){startBattle(state.explore?.area||state.currentArea,false)}}else if(state.mode==='battle'){if(y>226&&state.battle&&(state.battle.status==='victory'||state.battle.status==='defeat'))finishBattle()}else if(y>226){state.mode='base';dialog=null}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();const px=(e.clientX-rect.left)*canvas.width/rect.width,py=(e.clientY-rect.top)*canvas.height/rect.height;handle((px-ox)/scale,(py-oy)/scale)});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D',' ','Enter','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;if(e.key==='Escape'||e.key==='Enter'){if(dialog)dialog=null;else if(state.mode==='explore')returnFromExplore();else if(state.mode==='battle'&&state.battle&&(state.battle.status==='victory'||state.battle.status==='defeat'))finishBattle()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false});
function bindMoveButton(id,direction){const el=document.getElementById(id);const start=e=>{e.preventDefault();keys[direction]=true;if(el.setPointerCapture&&e.pointerId!==undefined)try{el.setPointerCapture(e.pointerId)}catch(_){}};const stop=e=>{e.preventDefault();keys[direction]=false};el.addEventListener('pointerdown',start);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',()=>{keys[direction]=false});}
bindMoveButton('moveLeft','left');bindMoveButton('moveRight','right');
addEventListener('blur',()=>{keys.left=keys.right=false;save()});
function update(dt){t+=dt;const bonfireLevel=state.facilities.find(f=>f.id==='bonfire')?.level||0;const millLevel=state.facilities.find(f=>f.id==='lumber_mill')?.level||0;const farmLevel=state.facilities.find(f=>f.id==='farm')?.level||0;state.wood+=(0.2*bonfireLevel+0.2*millLevel)*dt;state.food+=(1/10*farmLevel)*dt;if(state.mode==='base'){player.walking=keys.left!==keys.right;if(player.walking){player.dir=keys.right?1:-1;player.x+=player.dir*75*dt}player.x=Math.max(8,Math.min(W-40,player.x))}else if(state.mode==='explore'&&state.explore&&now()>=state.explore.ends)returnFromExplore();else if(state.mode==='battle'){if(state.battle?.status==='victory'||state.battle?.status==='defeat'){if(!state.battle?.resultAt)state.battle.resultAt=now()+2600;if(now()>=state.battle.resultAt)finishBattle()}else tickBattle();}if(Math.floor(t)%20===0&&Math.abs(t-Math.floor(t))<dt)save()}
function loop(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);tickBattle();if(state.mode==='explore'&&state.explore&&!state.battle&&now()>=state.explore.ends)returnFromExplore();render();requestAnimationFrame(loop)}
save();requestAnimationFrame(loop);
})();
</script>
</body>

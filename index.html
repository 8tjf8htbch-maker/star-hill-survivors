<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11152d">
<title>星明かりの水辺</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11152d}body{touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
</style>
</head>
<body>
<canvas id="game" aria-label="星明かりの水辺。左右キーまたは画面下の矢印で移動"></canvas>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;
const W=480,H=270,SPRITE_W=32,SPRITE_H=32,FRAME_COUNT=4,FRAME_RATE=8,PLAYER_SCALE=1;
const WORLD=2200,GROUND=211,SPEED=115;
let scale=1,ox=0,oy=0,cam=0,last=0,t=0;
const keys={left:false,right:false};
const p={x:64,y:GROUND-SPRITE_H*PLAYER_SCALE,w:SPRITE_W*PLAYER_SCALE,h:SPRITE_H*PLAYER_SCALE,dir:1,walking:false};
const img=new Image();let imageReady=false;img.onload=()=>imageReady=true;img.onerror=()=>imageReady=false;img.src='player.png';
const stars=Array.from({length:115},(_,i)=>({x:Math.random()*WORLD,y:Math.random()*133,s:Math.random()>.82?2:1,phase:Math.random()*6}));
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
function r(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function sky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10152e');g.addColorStop(.43,'#272447');g.addColorStop(.72,'#57416b');g.addColorStop(1,'#98687b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 stars.forEach(s=>{const x=s.x-cam*.13;if(x<0||x>W)return;r(x,s.y,s.s,s.s,Math.sin(t*2+s.phase)>.6?'#fff0bf':'#c1c9e9')});
 // moon and constellation
 r(386,25,20,20,'#f5e3b8');r(392,21,17,20,'#f5e3b8');r(399,26,12,15,'#292447');
 ctx.strokeStyle='#9ba8d9';ctx.lineWidth=1;ctx.beginPath();[[302,32],[317,23],[333,36],[349,20],[365,29]].forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
}
function ridge(speed,base,colour,step,seed){ctx.fillStyle=colour;for(let wx=-step;wx<W+step;wx+=step){let worldX=wx+cam*speed;let h=18+Math.abs(Math.sin(worldX*.027+seed))*39;ctx.beginPath();ctx.moveTo(wx,base);ctx.lineTo(wx+step*.48,base-h);ctx.lineTo(wx+step,base);ctx.closePath();ctx.fill()}}
function scenery(){
 ridge(.16,164,'#24243f',65,1);ridge(.28,177,'#222b43',58,4);ridge(.46,188,'#1a3441',48,2);
 // forest silhouettes with parallax
 for(let i=0;i<34;i++){let x=i*62-cam*.58;if(x<-30||x>W+30)continue;let y=159+Math.sin(i*8)*9,sway=Math.sin(t*1.15+i*1.7)*2;r(x+7+sway*.25,y,4,30,'#142c35');ctx.fillStyle='#19373c';ctx.beginPath();ctx.moveTo(x+9+sway,y-26);ctx.lineTo(x-7+sway*.4,y+8);ctx.lineTo(x+25+sway*.4,y+8);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(x+9+sway*.7,y-13);ctx.lineTo(x-9+sway*.35,y+18);ctx.lineTo(x+27+sway*.35,y+18);ctx.closePath();ctx.fill()}
}
function water(){r(0,185,W,85,'#192f48');for(let y=190;y<H;y+=10)for(let x=0;x<W;x+=1)if(Math.sin((x+cam*.45)*.12+y*.31+t*1.4)>.94)r(x,y,5+((x+y)%11),1,y<224?'#52617c':'#344d6b')}
function cabin(wx,sc){const x=Math.floor(wx-cam);if(x<-90||x>W+90)return;ctx.save();ctx.translate(x,129);ctx.scale(sc,sc);let glow=.82+.12*Math.sin(t*2.8+wx*.01)+.06*Math.sin(t*5.1+wx);
 r(8,49,66,3,'#9e6b65');r(15,56,48,2,'#c18370');[8,27,51,68].forEach(a=>r(a,32,3,28,'#563d48'));r(0,29,80,5,'#b28664');r(2,34,76,2,'#d3a078');
 r(12,8,56,23,'#825b69');r(9,12,62,20,'#b78070');r(15,15,50,17,'#875968');r(7,8,66,4,'#4a405b');r(13,3,54,5,'#5d4568');r(23,0,33,4,'#76506d');
 [[21,17],[48,17]].forEach(([x,y])=>{r(x,y,10,10,'#f5b35e');r(x+2,y+2,6,6,glow>.86?'#fff1b0':'#ffedac');ctx.globalAlpha=.09*glow;ctx.fillStyle='#ffc36e';ctx.beginPath();ctx.arc(x+5,y+5,12,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});r(35,21,8,13,'#49354b');r(37,23,4,8,'#d08b5b');r(75,21,2,11,'#59404b');r(71,18,9,9,'#f5a84e');r(73,20,5,5,'#fff0a2');ctx.restore()}
function wheel(wx){const x=Math.floor(wx-cam),y=158;if(x<-20||x>W+20)return;ctx.strokeStyle='#ad8064';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4+t*.2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*14,y+Math.sin(a)*14);ctx.stroke()}r(x-3,y-3,6,6,'#d4a16d')}
function platform(){r(0,GROUND,W,5,'#d2a179');r(0,GROUND+5,W,18,'#805951');r(0,GROUND+23,W,3,'#4c3e4b');for(let x=-(cam%24);x<W;x+=24){r(x,GROUND+1,1,17,'#513d49');r(x+3,GROUND+8,2,1,'#e4b382')}for(let x=-(cam%72);x<W;x+=72){r(x,GROUND+22,4,25,'#493b49');r(x-2,GROUND+21,8,3,'#b98b68')}
 for(let wx=100;wx<WORLD;wx+=210){let x=wx-cam;if(x<0||x>W)continue;let flicker=.72+.18*Math.sin(t*7+wx*.03)+.1*Math.sin(t*13+wx);r(x,GROUND-18,2,18,'#4b3b49');r(x-4,GROUND-25,10,9,'#e98b43');r(x-2,GROUND-23,6,5,flicker>.82?'#fff3b2':'#ffeba0');ctx.globalAlpha=.08+.07*flicker;ctx.fillStyle='#ffb34f';ctx.beginPath();ctx.arc(x+1,GROUND-21,10+flicker*6,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function fallback(){let x=Math.round(p.x-cam),y=Math.round(p.y),step=p.walking?Math.sin(t*FRAME_RATE*Math.PI)*2:0,arm=p.walking?Math.sin(t*FRAME_RATE*Math.PI+Math.PI)*2:0;r(x+5,y+29,22,3,'#11172b');r(x+10,y+3,12,3,'#30243e');r(x+7,y+6,18,8,'#30243e');r(x+9,y+8,14,7,'#efbd91');r(x+7,y+5,18,4,'#4c3650');r(x+8,y+13,16,3,'#b47a68');r(x+8,y+16,16,10,'#678c9a');r(x+5,y+17+arm,4,8,'#678c9a');r(x+23,y+17-arm,4,8,'#678c9a');r(x+10,y+26+step,5,Math.max(2,5-step),'#3d334b');r(x+18,y+26-step,5,Math.max(2,5+step),'#3d334b');r(x+11,y+9,2,2,'#29243a');r(x+20,y+9,2,2,'#29243a');r(x+10,y+31+step,6,1,'#d8a078');r(x+18,y+31-step,6,1,'#d8a078')}
function player(){let x=Math.round(p.x-cam),y=Math.round(p.y);if(imageReady&&img.naturalWidth>=SPRITE_W&&img.naturalHeight>=SPRITE_H){const frames=Math.max(1,Math.floor(img.naturalWidth/SPRITE_W)),f=p.walking?Math.floor(t*FRAME_RATE)%Math.min(FRAME_COUNT,frames):0;ctx.save();if(p.dir<0){ctx.translate(x+p.w,y);ctx.scale(-1,1);ctx.drawImage(img,f*SPRITE_W,0,SPRITE_W,SPRITE_H,0,0,p.w,p.h)}else ctx.drawImage(img,f*SPRITE_W,0,SPRITE_W,SPRITE_H,x,y,p.w,p.h);ctx.restore()}else fallback()}
function button(x,y,dir){ctx.globalAlpha=.72;r(x,y,43,35,'#202543');r(x+1,y+1,41,2,'#a89abb');ctx.fillStyle='#f9e6b9';ctx.beginPath();if(dir<0){ctx.moveTo(x+13,y+17);ctx.lineTo(x+27,y+7);ctx.lineTo(x+27,y+27)}else{ctx.moveTo(x+30,y+17);ctx.lineTo(x+16,y+7);ctx.lineTo(x+16,y+27)}ctx.closePath();ctx.fill();ctx.globalAlpha=1}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#11152d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,ox,oy);ctx.imageSmoothingEnabled=false;sky();scenery();water();cabin(220,.72);cabin(1030,.8);cabin(1650,.7);wheel(280);wheel(1090);for(let i=0;i<8;i++){let x=(i*71-cam*.4)%W;if(x<0)x+=W;r(x,205+(i%4)*12,19,1,'#a96d70')}platform();cabin(640,1);cabin(1290,.92);player();button(14,H-49,-1);button(W-57,H-49,1)}
function update(dt){const l=keys.left,rgt=keys.right;p.walking=l!==rgt;if(p.walking){p.dir=rgt?1:-1;p.x+=p.dir*SPEED*dt}p.x=Math.max(0,Math.min(WORLD-p.w,p.x));p.y=GROUND-p.h;cam=Math.max(0,Math.min(WORLD-W,p.x-W*.42));t+=dt}
let logicalPointer=null;
function pointer(e,down){const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;const lx=(x-ox)/scale,ly=(y-oy)/scale;if(down){if(ly>H-58&&lx<68)keys.left=true;else if(ly>H-58&&lx>W-70)keys.right=true;else logicalPointer='';}else{keys.left=false;keys.right=false;logicalPointer=null}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);pointer(e,true)});canvas.addEventListener('pointerup',e=>{e.preventDefault();pointer(e,false)});canvas.addEventListener('pointercancel',e=>pointer(e,false));
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false});addEventListener('blur',()=>{keys.left=keys.right=false});
function loop(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>

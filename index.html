<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11152d">
<title>星の丘のサバイバーズ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11152d}body{touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#movePad{display:none;position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));z-index:5;gap:12px;touch-action:none;user-select:none}
.moveButton{width:68px;height:68px;border:2px solid #c6b5d8;border-radius:18px;background:rgba(28,32,62,.82);color:#fff0c9;font:700 30px system-ui;box-shadow:0 3px 0 rgba(0,0,0,.35);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.moveButton:active{background:rgba(105,86,130,.95);transform:translateY(2px)}
@media (hover:none),(pointer:coarse){#movePad{display:flex}}
@media (max-width:420px){.moveButton{width:60px;height:60px;font-size:26px}#movePad{gap:8px}}
</style>
</head>
<body>
<canvas id="game" aria-label="星の丘のサバイバーズ。基地で仲間と過ごし、探索して、思い出を残そう"></canvas>
<div id="movePad" aria-label="キャラクター移動コントローラー">
 <button class="moveButton" id="moveLeft" aria-label="左へ移動">◀</button>
 <button class="moveButton" id="moveRight" aria-label="右へ移動">▶</button>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;
const W=480,H=270,SW=32,SH=32,FRAME_COUNT=4,FRAME_RATE=8;
let scale=1,ox=0,oy=0,t=0,last=0;
const keys={left:false,right:false};
const SAVE_KEY='HOSHINO_OKA_SAVE_DATA';
const now=()=>Date.now();
const facilityDefaults=()=>[
 {id:'bonfire',name:'焚き火',level:0,status:'unbuilt',woodCost:[5,50,200,500,1000],metalCost:[0,10,50,100,200],desc:'基地の明かり・木材生産'},
 {id:'hut',name:'小さな小屋',level:0,status:'unbuilt',woodCost:[20,100,300],metalCost:[0,20,80],desc:'ミナの居住地・手紙が増える'},
 {id:'farm',name:'簡易農園',level:0,status:'unbuilt',woodCost:[40,150,400],metalCost:[5,30,100],desc:'食料を自動生産'},
 {id:'lumber_mill',name:'製材所',level:0,status:'unbuilt',woodCost:[60,180,450],metalCost:[5,25,80],desc:'木材の自動生産'},
 {id:'diner',name:'集いの食堂',level:0,status:'unbuilt',woodCost:[80,250,600],metalCost:[15,50,150],desc:'料理で仲間を元気にする'},
 {id:'workshop',name:'クラフト工房',level:0,status:'unbuilt',woodCost:[150,400,900],metalCost:[40,120,300],desc:'装備と強化機能を解放'},
 {id:'observatory',name:'星空の観測台',level:0,status:'unbuilt',woodCost:[300,800,2000],metalCost:[100,300,800],desc:'星晶生産・特殊探索'}
];
const characterDefaults=()=>[
 {id:'mina',name:'ミナ',role:'道具の修理が得意',mood:'ここがみんなの帰る場所になるといいな。',x:135,color:'#d9a2c8',unlocked:false,level:1,exp:0,affinity:1,affinityExp:0},
 {id:'joe',name:'ジョー',role:'料理好き',mood:'温かいスープを作るよ。',x:225,color:'#82b5c6',unlocked:false,level:1,exp:0,affinity:1,affinityExp:0},
 {id:'sera',name:'セラ',role:'天体観測が好き',mood:'星の向こうに、昔の記録が眠っている気がする。',x:315,color:'#9bc48b',unlocked:false,level:1,exp:0,affinity:1,affinityExp:0}
];
const defaultState=()=>({
 mode:'base',wood:10,food:0,metal:0,starCrystals:0,herbs:0,crystal:0,level:0,lamps:false,flowers:false,bridge:false,
 lastSeen:now(),createdAt:now(),day:1,progressStep:0,explore:null,currentArea:'forest_1',clearedAreas:[],
 events:[],memories:[],talkedToday:false,photos:[],letters:[],recipes:[],
 companions:characterDefaults(),facilities:facilityDefaults()
});
let state=defaultState(),toast='',toastUntil=0,dialog=null,player={x:72,dir:1,walking:false};
function normalizeState(s){
 const d=defaultState();state={...d,...s};
 state.food=Number(s.food??0);state.metal=Number(s.metal??0);state.starCrystals=Number(s.starCrystals??s.crystal??0);
 state.herbs=Number(s.herbs??0);state.crystal=state.starCrystals;
 state.progressStep=Number(s.progressStep??0);state.clearedAreas=s.clearedAreas||[];
 state.companions=characterDefaults().map(base=>({...base,...((s.companions||[]).find(x=>x.id===base.id)||{})}));
 if(s.companions?.some(x=>x.id==='luna')){const old=s.companions;state.companions=characterDefaults().map((base,i)=>({...base,...(old.find(x=>x.id===base.id)||{}),unlocked:base.id==='mina'?true:(old.find(x=>x.id===base.id)?.unlocked??false)}))}
 state.facilities=facilityDefaults().map(base=>({...base,...((s.facilities||[]).find(x=>x.id===base.id)||{})}));
 if(s.facilities?.some(x=>x.id==='kitchen')){const old=s.facilities;state.facilities=facilityDefaults().map((base,i)=>({...base,level:old.find(x=>x.id===(base.id==='diner'?'kitchen':base.id))?.level||0,status:(old.find(x=>x.id===(base.id==='diner'?'kitchen':base.id))?.level||0)>0?'active':'unbuilt'}))}
 state.lamps=!!s.lamps||state.facilities.find(x=>x.id==='bonfire').level>0;
 state.flowers=!!s.flowers;state.bridge=!!s.bridge;
 return state;
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){toast='セーブできませんでした。端末の空き容量を確認してください。';toastUntil=now()+3500}}
function load(){
 try{
  const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('starHillSurvivors.save.v1');
  if(raw){
   const s=JSON.parse(raw);
   normalizeState(s);
   const previousTime=Number(s.lastPlayedAt||s.lastSeen||s.createdAt||now());
   const elapsed=Math.max(0,Math.min(8*60*60,Math.floor((now()-previousTime)/1000)));
   processOffline(elapsed);
   state.lastPlayedAt=now();
   save();
  }else{
   state.lastPlayedAt=now();
   save();
  }
 }catch(e){state=defaultState();state.lastPlayedAt=now();save()}
}
function processOffline(seconds){
 const elapsed=Math.max(0,Math.min(8*60*60,Math.floor(Number(seconds)||0)));
 if(elapsed<=0)return;
 const mins=Math.floor(elapsed/60);
 const levels={
  bonfire:state.facilities.find(f=>f.id==='bonfire')?.level||0,
  lumber_mill:state.facilities.find(f=>f.id==='lumber_mill')?.level||0,
  farm:state.facilities.find(f=>f.id==='farm')?.level||0,
  observatory:state.facilities.find(f=>f.id==='observatory')?.level||0
 };
 // 各施設の生産量は「生産速度 × 施設レベル × 経過秒数」で計算。
 const productionRate={woodPerSecond:0.2,lumberMillWoodPerSecond:0.2,foodPerSecond:1/10,starCrystalsPerSecond:1/3600};
 state.wood+=Math.floor(productionRate.woodPerSecond*levels.bonfire*elapsed);
 state.wood+=Math.floor(productionRate.lumberMillWoodPerSecond*levels.lumber_mill*elapsed);
 state.food+=Math.floor(productionRate.foodPerSecond*levels.farm*elapsed);
 state.starCrystals+=Math.floor(productionRate.starCrystalsPerSecond*levels.observatory*elapsed);
 state.crystal=state.starCrystals;
 const count=Math.floor(elapsed/1800);
 for(let i=0;i<count;i++){const pool=eventTemplates.filter(e=>state.companions.some(c=>c.id===e[0]&&c.unlocked));if(pool.length){const ev=pool[(state.events.length+i)%pool.length];addEvent(ev[2],'留守中の出来事')}}
 if(elapsed>60){
  if(count===0)addEvent('不在だった'+mins+'分の間、仲間たちは基地を見守っていました。','留守中の出来事');
  toast='おかえり。留守のあいだの暮らしが日誌に残ったよ。';toastUntil=now()+5000;
 }
}
function checkStory(){
 if(state.progressStep===0){dialog={title:'星の丘へ',lines:['小さな不思議な生き物「ピコ」が現れた。','ピコ：「ココハ『ホシノオカ』。タキビ・ツケル・ト、ナカマ・アツマル・ピ！」','焚き火を調べて、最初の灯りを取り戻そう。']};state.progressStep=1;return}
 if(state.progressStep>=2&&state.facilities.find(f=>f.id==='hut').level>0&&!state.companions.find(c=>c.id==='mina').unlocked){state.companions.find(c=>c.id==='mina').unlocked=true;state.progressStep=3;addEvent('ミナが仲間に加わった。「ここがみんなの帰る場所になるといいな。」','仲間加入');remember('ミナと出会った日');dialog={title:'ミナが仲間になった',lines:['「道具の修理なら得意だよ。」','ミナが基地で暮らし始めた。','仲間との会話と手紙の記録が解放された。']};return}
 if(state.facilities.find(f=>f.id==='farm').level>0&&state.facilities.find(f=>f.id==='diner').level>0&&!state.companions.find(c=>c.id==='joe').unlocked){state.companions.find(c=>c.id==='joe').unlocked=true;state.progressStep=Math.max(state.progressStep,4);addEvent('ジョーが仲間に加わり、食堂を開いた。','仲間加入');dialog={title:'ジョーが仲間になった',lines:['「みんなで食べると、きっとおいしいよ。」','食事のある暮らしが始まった。']};return}
 if(state.clearedAreas.includes('forest_1')&&!state.companions.find(c=>c.id==='sera').unlocked){state.companions.find(c=>c.id==='sera').unlocked=true;state.progressStep=5;addEvent('セラが仲間に加わった。','仲間加入');dialog={title:'セラが仲間になった',lines:['星の観測記録を持つセラが丘に戻ってきた。','写真と地図の記録が解放された。']};}
}
const sprite=new Image();let spriteReady=false;sprite.onload=()=>spriteReady=true;sprite.onerror=()=>spriteReady=false;sprite.src='player.png';
const stars=Array.from({length:105},()=>({x:Math.random()*W,y:Math.random()*145,s:Math.random()>.8?2:1,p:Math.random()*7}));
const eventTemplates=[
  ['luna','kai','台所からいい匂いがしたので、カイが食器を並べてくれた。','wood',1],
  ['kai','mio','カイが壊れた植木鉢を直し、ミオが新しい芽を植えた。','herbs',1],
  ['mio','luna','ミオの摘んだ薬草で、ルナが香りのよいお茶を淹れた。','herbs',1],
  ['luna','mio','ルナとミオが窓辺で、昔見た流れ星の話をしていた。','memory',0],
  ['kai','luna','カイが古いランタンを修理した。今夜は少し明るくなりそう。','lamp',0],
  ['mio','kai','ミオがカイの作業机に小さな花を飾った。','memory',0],
  ['luna','kai','焦げたパンを囲んで、三人で笑い声をあげた。','memory',0],
  ['kai','mio','カイがデッキの端に腰掛け、ミオに星座を教えていた。','memory',0],
  ['mio','luna','ミオが庭に小さな花壇を作り、ルナが水をあげた。','flower',0],
  ['luna','kai','ルナが「帰ってきたときに灯りが見えるように」とランタンを磨いた。','memory',0]
];
function addEvent(text,type='暮らしの記録'){state.events.unshift({text,type,at:now()});state.events=state.events.slice(0,40)}
function remember(text){if(!state.memories.includes(text))state.memories.unshift(text);state.memories=state.memories.slice(0,30)}
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();load();checkStory();
addEventListener('pagehide',()=>{state.lastPlayedAt=now();state.lastSeen=state.lastPlayedAt;save()});
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,size=8,color='#f4e5c4',align='left'){ctx.font=(size*1.2)+'px monospace';ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle=color;ctx.fillText(s,x,y)}
function panel(x,y,w,h){rect(x,y,w,h,'#171a32');rect(x,y,w,1,'#a98d8a');rect(x,y+h-1,w,1,'#5d526b');rect(x,y,1,h,'#8e7d91');rect(x+w-1,y,1,h,'#5d526b')}
function getTimeOfDay(){
 const hour=new Date().getHours();
 if(hour>=6&&hour<11)return 'morning';
 if(hour>=11&&hour<16)return 'day';
 if(hour>=16&&hour<19)return 'evening';
 return 'night';
}
function sky(){
 const phase=getTimeOfDay();
 const palettes={
  morning:['#536b91','#a8a4bd','#dba58c','#e6bd9c'],
  day:['#34577d','#6685a0','#b8a0a8','#d4a18f'],
  evening:['#211f45','#66436a','#bd6d79','#d99a81'],
  night:['#10152e','#272447','#604563','#98687b']
 };
 const colors=palettes[phase],g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,colors[0]);g.addColorStop(.45,colors[1]);g.addColorStop(.78,colors[2]);g.addColorStop(1,colors[3]);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(phase==='night'||phase==='evening'){
  stars.forEach(s=>{if(phase==='night'||s.y<65)rect(s.x,s.y,s.s, s.s,Math.sin(t*2+s.p)>.6?'#fff0bf':'#c1c9e9')});
 }else{
  // Soft, blocky clouds drift gently during daylight.
  for(let i=0;i<4;i++){const x=((i*137+t*(phase==='morning'?2:1.2))%(W+70))-35,y=30+(i%3)*25;rect(x,y,25,4,'#d8d6d9');rect(x+6,y-4,14,4,'#d8d6d9');rect(x+25,y+2,12,3,'#d8d6d9')}
 }
 if(phase==='night'){
  rect(382,22,21,21,'#f5e3b8');rect(391,19,17,22,'#f5e3b8');rect(399,25,11,16,'#292447');
 }else{
  const sunX=phase==='morning'?78:phase==='day'?365:245,sunY=phase==='morning'?45:phase==='day'?30:62;
  rect(sunX,sunY,12,12,'#f6d7a0');rect(sunX-4,sunY+4,20,4,'#f6d7a0');rect(sunX+4,sunY-4,4,20,'#f6d7a0');
 }
}
function ridge(base,color,step,seed){ctx.fillStyle=color;for(let x=-step;x<W+step;x+=step){const h=18+Math.abs(Math.sin(x*.027+seed))*35;ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+step*.48,base-h);ctx.lineTo(x+step,base);ctx.closePath();ctx.fill()}}
function trees(){for(let i=0;i<19;i++){let x=i*29+Math.sin(i*8)*7,y=157+Math.sin(i*5)*7,sway=Math.sin(t*1.2+i*1.7)*1.5;rect(x+6+sway,y,4,29,'#142c35');ctx.fillStyle='#19373c';ctx.beginPath();ctx.moveTo(x+8+sway,y-24);ctx.lineTo(x-5+sway,y+8);ctx.lineTo(x+21+sway,y+8);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(x+8+sway,y-12);ctx.lineTo(x-7+sway,y+18);ctx.lineTo(x+23+sway,y+18);ctx.closePath();ctx.fill()}}
function water(){rect(0,184,W,86,'#192f48');for(let i=0;i<45;i++){let x=(i*37+t*5)%W,y=190+(i*17)%72;rect(x,y,8+(i%4)*3,1,Math.sin(t*1.4+i)>.2?'#52617c':'#344d6b')}}
function lamp(x,y){let f=.8+.18*Math.sin(t*3+x);ctx.globalAlpha=.1*f;ctx.fillStyle='#ffc36e';ctx.beginPath();ctx.arc(x,y,13+f*4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;rect(x-1,y,2,12,'#4b3b49');rect(x-4,y-7,8,8,'#e98b43');rect(x-2,y-5,4,4,'#fff0a2')}
function cabin(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);rect(0,32,80,3,'#9e6b65');rect(8,12,64,22,'#825b69');rect(4,9,72,5,'#4a405b');rect(13,3,54,8,'#5d4568');rect(19,16,12,11,'#f5b35e');rect(21,18,8,7,'#fff0a2');rect(48,16,12,11,'#f5b35e');rect(50,18,8,7,'#fff0a2');rect(36,22,8,12,'#49354b');rect(10,34,3,20,'#563d48');rect(67,34,3,20,'#563d48');ctx.restore()}
function wheel(x,y){ctx.strokeStyle='#ad8064';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4+t*.22;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*14,y+Math.sin(a)*14);ctx.stroke()}rect(x-3,y-3,6,6,'#d4a16d')}
function deck(){rect(0,202,W,6,'#d2a179');rect(0,208,W,19,'#805951');rect(0,227,W,3,'#4c3e4b');for(let x=0;x<W;x+=24){rect(x,203,1,22,'#513d49');rect(x+3,212,2,1,'#e4b382')}for(let x=14;x<W;x+=80){rect(x,228,4,32,'#493b49');rect(x-2,227,8,3,'#b98b68')}for(let x=50;x<W;x+=145)lamp(x,196)}
function character(x,y,color='#82b5c6',walking=false,dir=1){rect(x+5,y+29,22,3,'#11172b');if(spriteReady&&sprite.naturalWidth>=32&&sprite.naturalHeight>=32){let f=walking?Math.floor(t*FRAME_RATE)%(Math.min(FRAME_COUNT,Math.floor(sprite.naturalWidth/32))):0;ctx.save();if(dir<0){ctx.translate(x+32,y);ctx.scale(-1,1);ctx.drawImage(sprite,f*32,0,32,32,0,0,32,32)}else ctx.drawImage(sprite,f*32,0,32,32,x,y,32,32);ctx.restore();return}rect(x+10,y+3,12,3,'#30243e');rect(x+7,y+6,18,8,'#30243e');rect(x+9,y+8,14,7,'#efbd91');rect(x+7,y+5,18,4,'#4c3650');rect(x+8,y+13,16,3,'#b47a68');rect(x+8,y+16,16,10,color);let step=walking?Math.sin(t*FRAME_RATE*Math.PI)*2:0;rect(x+5,y+17+step,4,8,color);rect(x+23,y+17-step,4,8,color);rect(x+10,y+26+step,5,Math.max(2,5-step),'#3d334b');rect(x+18,y+26-step,5,Math.max(2,5+step),'#3d334b');rect(x+11,y+9,2,2,'#29243a');rect(x+20,y+9,2,2,'#29243a')}
function drawCompanionActivities(){
 const phase=getTimeOfDay();
 const unlocked=(state.companions||[]).filter(c=>c.unlocked);
 unlocked.forEach((c,i)=>{
  let x=c.x+Math.sin(t*.45+i*2)*3,y=170;
  let activity='拠点でひと休み';
  if(phase==='morning'){
   x=64+i*54+Math.sin(t*.5+i)*4;y=166;activity='朝の支度中';
   if(i===0&&state.facilities.farm&&state.facilities.farm.level>0){x=42+Math.sin(t*.6)*4;y=165;activity='農園のお世話';}
  }else if(phase==='day'){
   x=82+i*58+Math.sin(t*.45+i*2)*4;y=169;activity='拠点のお手伝い';
   if(i===0&&state.facilities.farm&&state.facilities.farm.level>0){x=42+Math.sin(t*.6)*4;y=165;activity='農園のお世話';}
   else if(i===1&&state.facilities.bonfire&&state.facilities.bonfire.level>0){x=254+Math.sin(t*.4)*3;y=171;activity='焚き火の準備';}
   else if(i===2&&state.facilities.lumber_mill&&state.facilities.lumber_mill.level>0){x=416+Math.sin(t*.5)*3;y=168;activity='木材を整理中';}
  }else if(phase==='evening'){
   x=218+i*15+Math.sin(t*.35+i)*3;y=171;activity='焚き火に集まっている';
   if(!state.facilities.bonfire||state.facilities.bonfire.level===0){x=150+i*48;y=169;activity='帰り支度中';}
  }else{
   x=220+i*13+Math.sin(t*.25+i)*2;y=172;activity='焚き火のそばで休んでいる';
   if(!state.facilities.bonfire||state.facilities.bonfire.level===0){x=160+i*35;y=171;activity='小屋で休んでいる';}
  }
  drawCharacter(c,x,y);
  text(c.name,x+8,y-7,7,'#fff0c9','center');
  if(Math.sin(t*1.1+i*2)>.985){panel(x-20,y-23,64,12,'#25213bdc');text(activity,x+12,y-15,6,'#fff0c9','center');}
 });

 const conversations=[
  ['mina','joe','農園の野菜、今日もよく育ってるよ。','焚き火のあとに一緒に食べよう。'],
  ['joe','sera','木材は足りてる？','うん、明日の分もまとめておいたよ。'],
  ['sera','mina','この拠点、少しずつ賑やかになったね。','みんなで手入れしているからね。']
 ];
 if(phase==='evening'||phase==='night'){
  const pair=conversations.find(pair=>unlocked.some(c=>c.id===pair[0])&&unlocked.some(c=>c.id===pair[1]));
  if(pair){
   const bucket=Math.floor((Number(state.worldTime)||t)/24);
   const pick=(bucket+Math.floor(t/8))%conversations.length;
   const dialogue=conversations[pick];
   if(dialogue&&unlocked.some(c=>c.id===dialogue[0])&&unlocked.some(c=>c.id===dialogue[1])){
    const speaker=unlocked.find(c=>c.id===dialogue[0]);
    const listener=unlocked.find(c=>c.id===dialogue[1]);
    if(speaker&&listener&&Math.sin(t*.22)>0.65){
     const message=dialogue[2+(Math.floor(t/6)%2)];
     panel(100,102,280,27,'#24203beF');
     text(speaker.name+'「'+message+'」',240,112,7,'#fff0c9','center');
     text(listener.name+'「'+dialogue[3]+'」',240,122,7,'#d9e5ff','center');
    }
   }
  }
 }
}
function drawFacilityDecorations(){
 const level=id=>state.facilities.find(f=>f.id===id)?.level||0;
 // 焚き火：建設すると拠点中央に炎と石囲いが現れる
 if(level('bonfire')>0){
  rect(226,187,28,10,'#5a4650');rect(230,184,5,6,'#9a8a88');rect(245,184,5,6,'#9a8a88');
  rect(235,181,8,9,'#e97c43');rect(237,177,4,8,'#ffd16b');rect(238,180,2,5,'#fff0a2');
  text('焚き火 Lv.'+level('bonfire'),240,199,6,'#fff0c9','center');
 }
 // 農園：作物の列が施設レベルに応じて増える
 if(level('farm')>0){
  rect(20,177,57,19,'#58464a');rect(22,179,53,15,'#70534c');
  for(let row=0;row<Math.min(3,level('farm')+1);row++){
   for(let col=0;col<5;col++){const x=26+col*9,y=181+row*4;rect(x,y,2,3,'#5b9b68');rect(x+2,y-1,2,3,(row+col)%2?'#9fca79':'#d7d88b')}
  }
  text('農園 Lv.'+level('farm'),48,198,6,'#fff0c9','center');
 }
 // 製材所：木材の山と作業台を表示
 if(level('lumber_mill')>0){
  rect(397,180,42,14,'#604653');rect(400,177,35,4,'#b9825d');
  for(let i=0;i<Math.min(4,level('lumber_mill')+1);i++){rect(401+i*8,172,7,5,'#b9825d');rect(402+i*8,173,5,3,'#e0b17a')}
  rect(409,184,18,8,'#8c624d');rect(411,186,14,2,'#d5a16e');
  text('製材所 Lv.'+level('lumber_mill'),418,198,6,'#fff0c9','center');
 }
 // 小屋：未建設時は出さず、建設後に自分の居住小屋として現れる
 if(level('hut')>0){cabin(174,132,0.72);text('小屋 Lv.'+level('hut'),203,171,6,'#fff0c9','center')}
}
function drawBase(){sky();ridge(151,'#24243f',65,1);ridge(171,'#222b43',58,4);trees();water();cabin(34,133,.8);cabin(365,141,.7);wheel(390,172);deck();drawFacilityDecorations();if(state.lamps){for(let i=0;i<4;i++)lamp(105+i*82,187)}if(state.flowers){for(let i=0;i<9;i++){let x=28+i*49;rect(x,198,2,4,'#5d9b70');rect(x-2,197,3,3,i%2?'#efb2d0':'#e9d58a')}}if(state.bridge){rect(0,199,W,3,'#d6b58a');for(let x=10;x<W;x+=35)rect(x,195,3,5,'#e5c39b')}
 // 仲間は建設済み施設の近くで、それぞれの暮らしを見せる
 drawCompanionActivities();
 character(player.x,170,'#b6c9da',player.walking,player.dir);
 cabin(198,126,.92);
 const phaseLabel=({morning:'朝',day:'昼',evening:'夕方',night:'夜'})[getTimeOfDay()];
 text('星の丘のサバイバーズ',10,9,10,'#fff0c9');
 text(phaseLabel,W-10,23,8,'#fff0c9','right');
 text('木材 '+Math.floor(state.wood)+'  食料 '+Math.floor(state.food)+'  金属 '+Math.floor(state.metal)+'  星晶 '+Math.floor(state.starCrystals),10,23,8,'#d7d7ed');
 text('STEP '+state.progressStep+'/5',W-10,10,8,'#f4e5c4','right');
}
function drawExplore(){sky();ridge(151,'#24243f',65,1);ridge(171,'#222b43',58,4);trees();water();rect(0,203,W,67,'#243d3e');for(let i=0;i<30;i++){let x=(i*23+t*12)%W,y=185+(i*13)%68;rect(x,y,2,3,'#6a9b78')}rect(0,213,W,8,'#7b5b55');for(let x=0;x<W;x+=30)rect(x,213,2,8,'#b98b68');character(90,178,'#b6c9da',true,player.dir);text(({forest_1:'忘れられた森',city_2:'沈んだ旧市街',highland_3:'星降りの高原'})[state.explore?.area||state.currentArea]||'忘れられた森',10,10,10,'#fff0c9');text('探索中…　見つけたものを持ち帰ろう',10,24,8,'#e7dded');for(let i=0;i<4;i++){let x=250+i*45,y=185+Math.sin(t*2+i)*3;rect(x,y,7,6,i===2?'#a5d9e6':'#86b58b');rect(x+2,y-2,3,3,'#d9f1b5')}if(state.explore){let remaining=Math.max(0,state.explore.ends-now());text('帰還まで '+Math.ceil(remaining/1000)+'秒',W-10,10,8,'#fff0c9','right')}}
function button(x,y,w,h,label,id){panel(x,y,w,h);text(label,x+w/2,y+Math.floor((h-8)/2),8,'#f4e5c4','center')}
function drawControls(){if(state.mode==='base'){button(8,232,91,28,'仲間と話す','talk');button(105,232,91,28,'探索に出る','explore');button(202,232,91,28,'施設を育てる','build');button(299,232,82,28,'暮らしの日誌','journal');button(387,232,85,28,'思い出 '+state.memories.length,'memory');}else if(state.mode==='explore'){button(8,232,104,28,'基地へ帰る','return');button(370,232,102,28,'探索を続ける','continue')}else{button(8,232,85,28,'基地へ戻る','home')}}
function drawDialog(){if(!dialog)return;panel(35,55,410,162);text(dialog.title,47,66,10,'#ffe7b6');let lines=dialog.lines||[];lines.slice(0,7).forEach((line,i)=>text(line,47,84+i*15,8,'#f0e6dd'));button(352,188,80,20,'閉じる','close')}
function drawToast(){if(toast&&now()<toastUntil){panel(55,37,370,25);text(toast,240,45,8,'#fff0c9','center')}}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#11152d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,ox,oy);ctx.imageSmoothingEnabled=false;if(state.mode==='explore')drawExplore();else drawBase();drawControls();drawDialog();drawToast()}
function talk(){const available=state.companions.filter(c=>c.unlocked);if(!available.length){dialog={title:'仲間との出会い',lines:['まずは焚き火を修理し、小さな小屋を建てよう。','仲間たちが少しずつ集まってくるよ。']};return}const c=available[Math.floor(Math.random()*available.length)];const lines=[c.mood,'今日のこと、あとで日誌にも残しておこう。','この基地の灯りを見ると、帰ってきたって感じがするね。','次の冒険も、みんなで帰ってこよう。'];const line=lines[Math.floor(Math.random()*lines.length)];dialog={title:c.name+' ・ '+c.role,lines:[line,'','小さな時間も、ここでの思い出。']};state.talkedToday=true;addEvent(c.name+'：「'+line+'」','仲間との会話');save()}
function explore(area='forest_1'){if(state.mode==='explore')return;state.currentArea=area;state.mode='explore';state.explore={area,ends:now()+25000};player.x=72;dialog=null;toast='探索へ出発した。';toastUntil=now()+2500;save()}
function returnFromExplore(){if(state.mode!=='explore')return;const area=state.explore?.area||state.currentArea;let found='古い道しるべを見つけた。';if(area==='forest_1'){const wood=4+Math.floor(Math.random()*5),food=2+Math.floor(Math.random()*3);state.wood+=wood;state.food+=food;found='古い種袋を見つけた。木材'+wood+'、食料'+food+'を持ち帰った。';if(!state.clearedAreas.includes(area)){state.clearedAreas.push(area);state.flowers=true;remember('忘れられた森で古い種袋を見つけた');}}else if(area==='city_2'){const metal=2+Math.floor(Math.random()*4),food=1+Math.floor(Math.random()*2);state.metal+=metal;state.food+=food;found='破れたレシピと金属'+metal+'を見つけた。';if(!state.clearedAreas.includes(area))state.clearedAreas.push(area);}else{const metal=3+Math.floor(Math.random()*3),crystal=1+Math.floor(Math.random()*2);state.metal+=metal;state.starCrystals+=crystal;found='星空のレンズの欠片と星晶'+crystal+'を見つけた。';if(!state.clearedAreas.includes(area))state.clearedAreas.push(area);}state.crystal=state.starCrystals;state.mode='base';state.explore=null;addEvent('探索から帰還。'+found,'探索記録');remember(found);checkStory();if(!dialog)dialog={title:'おかえり！',lines:[found,'仲間たちが、帰りを待っていたよ。']};save()}
function build(){const facilities=state.facilities;dialog={title:'施設を建設・強化',lines:facilities.map((f,i)=>`${i+1}.${f.name} Lv.${f.level} 木${f.woodCost[Math.min(f.level, f.woodCost.length-1)]||'—'} 金${f.metalCost[Math.min(f.level, f.metalCost.length-1)]||'—'}`),kind:'build',options:facilities.map(f=>f.id)};}
function upgrade(id){const f=state.facilities.find(x=>x.id===id);if(!f)return;const idx=Math.min(f.level,f.woodCost.length-1),wc=f.woodCost[idx],mc=f.metalCost[idx];if(f.level>=f.woodCost.length){toast='この施設は最大レベルです。';toastUntil=now()+2600;return}if(state.wood<wc||state.metal<mc){toast='資源が足りません。木材'+wc+'・金属'+mc+'が必要です。';toastUntil=now()+2600;dialog=null;return}state.wood-=wc;state.metal-=mc;f.level++;f.status='active';state.level++;if(id==='bonfire'){state.lamps=true;remember('焚き火に最初の灯りがともった');addEvent('焚き火が修理され、基地に明かりが戻った。','基地の変化');state.progressStep=Math.max(state.progressStep,2)}if(id==='hut'){checkStory()}if(id==='farm')addEvent('簡易農園が育ち、食料を生産できるようになった。','基地の変化');if(id==='diner')addEvent('集いの食堂が整い、ジョーの料理が始まった。','基地の変化');if(id==='workshop'){state.bridge=true;remember('クラフト工房が整った');}if(id==='observatory')addEvent('星空の観測台が整い、星晶の生産が始まった。','基地の変化');if(id==='farm'&&f.level>=1)state.flowers=true;dialog={title:f.name+'が育った！',lines:[f.name+' Lv.'+f.level+' になった。','必要資源：木材'+wc+'・金属'+mc,'基地の景色と仲間の暮らしが少し変わった。']};save()}
function journal(){dialog={title:'暮らしの日誌',lines:state.events.length?state.events.slice(0,7).map(e=>'・'+e.text):['まだ記録はない。','仲間と話したり、探索に出たりしよう。']};}
function memories(){dialog={title:'思い出のかけら',lines:state.memories.length?state.memories.slice(0,7).map(m=>'✦ '+m):['まだ思い出はない。','探索の発見や基地の変化がここに残る。']};}
function handle(x,y){if(dialog){if(dialog.kind==='areas'&&y>80&&y<140){const idx=Math.floor((y-82)/15);const area=['forest_1','city_2','highland_3'][idx];if(area){if(idx>0&&!state.clearedAreas.includes(idx===1?'forest_1':'city_2')){toast='先に前のエリアを探索しよう。';toastUntil=now()+2400;dialog=null;return}dialog=null;explore(area);return}}if(dialog.kind==='build'&&y>80&&y<180){let idx=Math.floor((y-82)/15);const id=dialog.options?.[idx];if(id){upgrade(id);return}}dialog=null;return}
 if(state.mode==='base'){if(y>226){if(x<100)talk();else if(x<201){dialog={title:'探索エリア',lines:['1. 忘れられた森（木材・食料）','2. 沈んだ旧市街（金属・部品）','3. 星降りの高原（星晶・高純度金属）'],kind:'areas'};}else if(x<297)build();else if(x<385)journal();else memories();return}if(y<210){const near=state.companions.find(c=>c.unlocked&&Math.abs((c.x+16)-x)<25);if(near){dialog={title:near.name+' ・ '+near.role,lines:[near.mood,'もう少し一緒に過ごす？']};addEvent(near.name+'と基地で少し話した。','仲間との交流');save()}else{player.x=Math.max(0,Math.min(W-32,x-16));player.dir=x>player.x?1:-1}}}else if(state.mode==='explore'){if(y>226&&x<120)returnFromExplore();else if(y>226&&x>350){toast='足元の草むらを調べている…';toastUntil=now()+2000}}else if(y>226){state.mode='base';dialog=null}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();const px=(e.clientX-rect.left)*canvas.width/rect.width,py=(e.clientY-rect.top)*canvas.height/rect.height;handle((px-ox)/scale,(py-oy)/scale)});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D',' ','Enter','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;if(e.key==='Escape'||e.key==='Enter'){if(dialog)dialog=null;else if(state.mode==='explore')returnFromExplore()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false});
function bindMoveButton(id,direction){const el=document.getElementById(id);const start=e=>{e.preventDefault();keys[direction]=true;if(el.setPointerCapture&&e.pointerId!==undefined)try{el.setPointerCapture(e.pointerId)}catch(_){}};const stop=e=>{e.preventDefault();keys[direction]=false};el.addEventListener('pointerdown',start);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',()=>{keys[direction]=false});}
bindMoveButton('moveLeft','left');bindMoveButton('moveRight','right');
addEventListener('blur',()=>{keys.left=keys.right=false;save()});
function update(dt){t+=dt;const bonfireLevel=state.facilities.find(f=>f.id==='bonfire')?.level||0;const millLevel=state.facilities.find(f=>f.id==='lumber_mill')?.level||0;const farmLevel=state.facilities.find(f=>f.id==='farm')?.level||0;state.wood+=(0.2*bonfireLevel+0.2*millLevel)*dt;state.food+=(1/10*farmLevel)*dt;if(state.mode==='base'){player.walking=keys.left!==keys.right;if(player.walking){player.dir=keys.right?1:-1;player.x+=player.dir*75*dt}player.x=Math.max(8,Math.min(W-40,player.x))}else if(state.mode==='explore'&&state.explore&&now()>=state.explore.ends)returnFromExplore();if(Math.floor(t)%20===0&&Math.abs(t-Math.floor(t))<dt)save()}
function loop(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);render();requestAnimationFrame(loop)}
save();requestAnimationFrame(loop);
})();
</script>

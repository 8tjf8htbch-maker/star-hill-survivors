<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182b3c"><title>星の丘のサバイバーズ</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#142536;color:#f5efd9;font-family:ui-monospace,monospace}.game{height:100svh;min-height:570px;position:relative;overflow:hidden;background:linear-gradient(#192b49 0%,#405a70 38%,#d28d80 63%,#e7b88a 70%,#55785e 71%,#294d48 100%)}.sky{position:absolute;inset:0 0 43%;background-image:radial-gradient(#fff0bf 1px,transparent 1.5px),radial-gradient(#dce7ee 1px,transparent 1.5px);background-size:71px 67px,113px 101px}.moon{position:absolute;right:15%;top:9%;width:52px;height:52px;border-radius:50%;background:#fff0c9;box-shadow:0 0 35px #ffe8b055}.mountain{position:absolute;bottom:26%;left:-5%;width:110%;height:38%;background:#34465a;clip-path:polygon(0 74%,12% 39%,22% 62%,36% 9%,49% 60%,63% 23%,76% 62%,87% 34%,100% 72%,100% 100%,0 100%)}.mountain.two{height:30%;bottom:24%;background:#506274;clip-path:polygon(0 62%,15% 20%,26% 57%,42% 35%,57% 0,72% 56%,85% 27%,100% 65%,100% 100%,0 100%)}.trees{position:absolute;bottom:22%;height:24%;width:100%;background:#203e3c;clip-path:polygon(0 47%,3% 47%,6% 9%,9% 47%,13% 18%,17% 52%,20% 5%,24% 48%,29% 24%,34% 55%,39% 10%,43% 48%,49% 21%,54% 52%,60% 4%,65% 47%,70% 14%,75% 53%,80% 5%,85% 47%,90% 18%,95% 52%,100% 20%,100% 100%,0 100%)}.ground{position:absolute;bottom:0;left:-5%;width:110%;height:32%;background:linear-gradient(165deg,#557d61,#315d4d 55%,#20453f);border-top:5px solid #76946c;clip-path:polygon(0 17%,18% 3%,38% 12%,58% 0,79% 9%,100% 1%,100% 100%,0 100%)}.path{position:absolute;bottom:-3%;left:34%;width:39%;height:35%;background:repeating-linear-gradient(0deg,#a58a68 0 23px,#88775f 24px 26px);clip-path:polygon(37% 0,65% 0,100% 100%,0 100%)}.hud{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;gap:8px;text-shadow:0 2px 4px #152436}.brand{font-size:14px;font-weight:bold}.tag{font-size:10px;color:#e1d5b8;margin-top:5px}.resources{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.resource{background:#132638cf;border:1px solid #ffffff30;border-radius:4px;padding:7px;font-size:11px}.resource b{color:#f6d68b}.building{position:absolute;z-index:3;bottom:31%;width:110px;height:98px;cursor:pointer;filter:drop-shadow(0 5px 0 #1c3536)}.roof{position:absolute;left:0;top:0;width:100%;height:45px;background:#794a48;clip-path:polygon(50% 0,100% 80%,91% 100%,50% 35%,9% 100%,0 80%)}.wall{position:absolute;left:12px;right:12px;top:34px;height:60px;background:#c7a477;border:4px solid #765a4b;box-shadow:inset 0 -8px #a9845e}.door{position:absolute;bottom:4px;left:44px;width:22px;height:38px;background:#624a40;border:3px solid #4c3c35;border-bottom:0}.win{position:absolute;top:47px;left:21px;width:18px;height:17px;background:#ffe6a0;border:3px solid #765a4b;box-shadow:0 0 12px #ffd78266}.win.r{left:auto;right:21px}.building small{position:absolute;top:100px;left:-20px;right:-20px;text-align:center;color:#fff3cf;text-shadow:1px 2px #20352d;font-size:11px;white-space:nowrap}.hq{left:calc(50% - 55px);bottom:34%;transform:scale(1.1);z-index:4}.farm{left:7%;bottom:24%;transform:scale(.78)}.work{right:5%;bottom:25%;transform:scale(.82)}.dine{left:12%;bottom:42%;transform:scale(.65)}.lab{right:12%;bottom:43%;transform:scale(.65)}.fire{position:absolute;z-index:5;bottom:25%;left:50%;transform:translateX(-50%);font-size:29px;filter:drop-shadow(0 0 12px #ffba55)}.person{position:absolute;z-index:6;bottom:24%;width:30px;height:43px;cursor:pointer;filter:drop-shadow(2px 3px 0 #20352d)}.head{position:absolute;left:5px;top:0;width:20px;height:17px;background:#edbd8e;border:3px solid #594b48}.hair{position:absolute;left:3px;top:-3px;width:24px;height:10px;background:#61483c;z-index:1}.body{position:absolute;left:3px;top:16px;width:24px;height:19px;background:#c98187;border:3px solid #4b4b45}.legs{position:absolute;left:5px;top:33px;width:7px;height:9px;background:#6c5348;box-shadow:12px 0 #6c5348}.name{position:absolute;top:-17px;left:-18px;right:-18px;text-align:center;font-size:10px;text-shadow:1px 1px #20352d}.mina{left:43%}.joe{left:56%}.joe .hair{background:#403b39}.joe .body{background:#638a91}.sera{left:62%;bottom:29%}.sera .hair{background:#c5a06c}.sera .body{background:#7c9a77}.hint{position:absolute;z-index:8;bottom:100px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:8px 12px;background:#182b3bc9;border:1px solid #fff3c455;border-radius:4px;font-size:11px}.nav{position:absolute;z-index:10;bottom:0;left:0;right:0;min-height:82px;padding:10px 5px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#172c3de8,#101e2bed);border-top:1px solid #d7c69b55;display:flex;justify-content:space-around;align-items:center}.nav button{color:#d6d6c9;border:0;background:transparent;font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:52px;padding:5px}.nav i{font-style:normal;font-size:21px}.nav button.active{color:#ffdc92}.dialog{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 30px));padding:18px;background:#172b3af5;border:2px solid #cbb486;box-shadow:0 10px 40px #0c1829a8;display:none}.dialog.open{display:block}.dialog h2{margin:0 0 8px;font-size:17px;color:#ffdda0}.dialog p{font-size:13px;line-height:1.7}.dialog button{background:#c99a62;color:#1d2b30;border:0;padding:10px;font:inherit;font-weight:bold;margin:3px}.dialog .close{float:right;background:transparent;color:white;border:1px solid #ffffff55}.toast{position:absolute;z-index:30;top:100px;left:50%;transform:translateX(-50%);background:#182b3bf2;border:1px solid #f2d69a;padding:10px;font-size:12px;display:none}@media(min-width:760px){.farm{left:20%}.work{right:20%}.dine{left:30%}.lab{right:30%}} </style></head><body><main class="game"><div class="sky"></div><div class="moon"></div><div class="mountain two"></div><div class="mountain"></div><div class="trees"></div><div class="ground"></div><div class="path"></div><header class="hud"><div><div class="brand">星の丘のサバイバーズ</div><div class="tag">小さな灯りを、明日へ。</div></div><div class="resources"><div class="resource">木材 <b id="wood">12</b></div><div class="resource">食料 <b id="food">8</b></div><div class="resource">星屑 <b id="dust">3</b></div></div></header><div class="building dine" data-place="食堂"><div class="roof"></div><div class="wall"></div><div class="win"></div><div class="win r"></div><div class="door"></div><small>食堂</small></div><div class="building lab" data-place="研究室"><div class="roof"></div><div class="wall"></div><div class="win"></div><div class="win r"></div><div class="door"></div><small>研究室</small></div><div class="building farm" data-place="畑"><div class="roof"></div><div class="wall"></div><div class="win"></div><div class="win r"></div><div class="door"></div><small>小さな畑</small></div><div class="building work" data-place="工房"><div class="roof"></div><div class="wall"></div><div class="win"></div><div class="win r"></div><div class="door"></div><small>木こりの工房</small></div><div class="building hq" data-place="本部"><div class="roof"></div><div class="wall"></div><div class="win"></div><div class="win r"></div><div class="door"></div><small>星見の本部</small></div><div class="fire">♨</div><div class="person mina" data-person="ミナ" role="button" tabindex="0"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="legs"></div><span class="name">ミナ</span></div><div class="person joe" data-person="ジョー" role="button" tabindex="0"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="legs"></div><span class="name">ジョー</span></div><div class="person sera" data-person="セラ" role="button" tabindex="0"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="legs"></div><span class="name">セラ</span></div><div class="hint" id="hint">建物や仲間をタップしてみよう</div><nav class="nav"><button class="active" data-tab="拠点"><i>⌂</i>拠点</button><button data-tab="探索"><i>✦</i>探索</button><button data-tab="仲間"><i>♧</i>仲間</button><button data-tab="日誌"><i>▤</i>日誌</button><button data-tab="図鑑"><i>✧</i>図鑑</button></nav><section class="dialog" id="dialog" role="dialog" aria-modal="true"><button class="close" id="close">閉じる</button><h2 id="title"></h2><div id="body"></div><div id="actions"></div></section><div class="toast" id="toast"></div></main><script>(function(){const $=id=>document.getElementById(id);const base={wood:12,food:8,dust:3,affection:{ミナ:0,ジョー:0,セラ:0},journal:["星の丘に、小さな拠点を見つけた。"],ready:0,last:Date.now()};let s;try{s=Object.assign({},base,JSON.parse(localStorage.getItem("starHillSave")||"{}"));s.affection=Object.assign({},base.affection,s.affection||{});s.journal=s.journal||base.journal}catch(e){s=base}function save(){s.last=Date.now();try{localStorage.setItem("starHillSave",JSON.stringify(s))}catch(e){}}function render(){$("wood").textContent=s.wood;$("food").textContent=s.food;$("dust").textContent=s.dust}function open(t,b,a){$("title").textContent=t;$("body").innerHTML=b;$("actions").innerHTML=a||"";$("dialog").classList.add("open")}function close(){$("dialog").classList.remove("open")}function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}$("close").onclick=close;document.querySelectorAll(".building").forEach(el=>el.onclick=()=>{const p=el.dataset.place;const desc={"本部":"みんなが帰ってくる、星見の丘の中心。ここを少しずつ大きくしていこう。","畑":"朝になると、食べられる草や野菜が育つ。","工房":"拾った木材から道具や家具を作る場所。","食堂":"旅の話をしながら、みんなで食卓を囲む場所。","研究室":"星屑を調べれば、知らない世界の手がかりが見つかるかも。"};let a="";if(p==="畑")a='<button data-a="food">収穫する（食料 +2）</button>';if(p==="工房")a='<button data-a="wood">木材を集める（木材 +2）</button>';if(p==="研究室")a='<button data-a="dust">星屑を調べる（星屑 +1）</button>';if(p==="本部")a='<button data-a="upgrade">本部を整える（木材 5）</button>';open(p,"<p>"+desc[p]+"</p>",a)});document.querySelectorAll(".person").forEach(el=>{function talk(){const n=el.dataset.person;const lines={"ミナ":"道具が少しずつ増えてきたね。いつか、みんなの部屋も作りたいな。","ジョー":"腹ごしらえは大事だ。ここを帰る場所にしよう。","セラ":"丘の向こうに、見たことのない星が落ちていたんだ。"};open(n,"<p>"+lines[n]+"</p><p>なかよし度："+s.affection[n]+"</p>",'<button data-a="talk" data-person="'+n+'">おしゃべりする</button>')}el.onclick=talk;el.onkeydown=e=>{if(e.key==="Enter")talk()}});$("actions").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a;if(a==="food"){s.food+=2;s.journal.unshift("畑で食料を収穫した。");toast("食料 +2")}if(a==="wood"){s.wood+=2;s.journal.unshift("木材を集めた。");toast("木材 +2")}if(a==="dust"){s.dust++;s.journal.unshift("研究室で星屑を見つけた。");toast("星屑 +1")}if(a==="upgrade"){if(s.wood<5){toast("木材が足りないよ");return}s.wood-=5;s.journal.unshift("本部の屋根を修繕した。");toast("本部が少し整った！")}if(a==="talk"){const n=b.dataset.person;s.affection[n]++;s.journal.unshift(n+"と焚き火のそばで話した。");toast(n+"とのなかよし度が上がった")}if(a==="explore"){s.ready=Date.now()+180000;open("探索中…","<p>みんなは丘の向こうへ出発した。帰りをのんびり待とう。</p><p>探索時間：3分</p>")}save();render();if(a!=="explore")close()};document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));const t=b.dataset.tab;if(t==="拠点"){close();return}if(t==="探索"){open("丘の向こうへ","<p>探索に出ると資源が見つかる。少し時間をかけて、帰りを待とう。</p>","<button data-a=\"explore\">探索に出発する</button>")}if(t==="仲間")open("丘で暮らす仲間",Object.keys(s.affection).map(n=>"<p><b>"+n+"</b>　なかよし度 "+s.affection[n]+"</p>").join(""));if(t==="日誌")open("旅の日誌",s.journal.slice(0,20).map(x=>"<p>・"+x+"</p>").join(""));if(t==="図鑑")open("星の図鑑","<p>仲間：3人　星屑："+s.dust+"</p><p>見つけたものの記録がここに増えていく。</p>")});function check(){if(s.ready&&Date.now()>=s.ready){s.ready=0;s.wood+=3;s.food+=2;s.dust++;s.journal.unshift("探索から帰還。木材3、食料2、星屑1を持ち帰った。");save();render();toast("探索から帰還！ 木材+3 食料+2 星屑+1")}}const away=Math.max(0,Date.now()-(s.last||Date.now()));if(away>60000){const n=Math.min(12,Math.floor(away/1800000));if(n){s.food+=n;s.journal.unshift("留守のあいだに食料を"+n+"個集めた。");toast("おかえり！ 食料 +"+n)}}render();save();setInterval(check,3000);window.addEventListener("pagehide",save)})();</script></body></html>
